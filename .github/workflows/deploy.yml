name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        run: |
          missing=()

          [ -n "$SERVER_HOST" ] || missing+=("SERVER_HOST")
          [ -n "$SERVER_USER" ] || missing+=("SERVER_USER")
          [ -n "$SERVER_SSH_KEY" ] || missing+=("SERVER_SSH_KEY")
          [ -n "$SERVER_PATH" ] || missing+=("SERVER_PATH")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing production environment secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            REPO_PATH="${{ secrets.SERVER_PATH }}"

            if [ -z "$REPO_PATH" ]; then
              echo "SERVER_PATH secret is not set. Example: /home/usuario/Repos/Discord-music-bot"
              exit 1
            fi

            if [ ! -d "$REPO_PATH/.git" ]; then
              echo "Repository not found at $REPO_PATH"
              exit 1
            fi

            cd "$REPO_PATH"
            git pull origin main

            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi

            source .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -e ".[dev]"

            if [ ! -f ".env" ]; then
              cp .env.example .env
              echo "Created .env from example. Fill in DISCORD_TOKEN and DISCORD_GUILD_ID on the server."
            fi

            sudo systemctl restart discord-music-bot
            sudo systemctl status discord-music-bot --no-pager | head -n 20
